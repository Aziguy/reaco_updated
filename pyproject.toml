[project]
name = "comegusto"
version = "2.0.0"
description = "Recettes, garde-manger anti-gaspi et comparateur de prix alimentaires basé sur les données ouvertes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "django-allauth[socialaccount]>=65.3",
    "django-htmx>=1.21",
    "django-csp>=4.0",
    "djangorestframework>=3.15",
    "drf-spectacular[sidecar]>=0.28",
    "httpx>=0.28",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "django-storages[s3]>=1.14",
    "anthropic>=2.3",
    "django-unfold>=0.110",
    "stripe>=12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "playwright>=1.64.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
testpaths = ["apps"]
filterwarnings = ["ignore:The default scheme will be changed:django.utils.deprecation.RemovedInDjango60Warning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]
"apps/conftest.py" = ["S106"]
"apps/core/templatetags/comegusto.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
