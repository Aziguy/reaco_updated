<label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-stone-700 dark:text-stone-300">{{ label }}</label>
<input type="text" name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="input text-center font-mono text-2xl tracking-[0.3em] placeholder:font-sans placeholder:text-base placeholder:tracking-normal{% if field.errors %} !border-red-400{% endif %}" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="{{ placeholder|default:'123456' }}" required autofocus{% if field.errors %} aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %}>
{% if field.errors %}<p id="{{ field.id_for_label }}-error" class="mt-2 text-sm text-red-600 dark:text-red-400">{{ field.errors|join:" " }}</p>{% endif %}
