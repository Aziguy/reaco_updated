{% extends "base.html" %}
{% block title %}{% block head_title %}{% endblock head_title %}{% endblock title %}
{% block main %}
  <div class="container-page flex justify-center py-12">
    <section class="card form-flow w-full max-w-md p-6 sm:p-8">
      {% block content %}{% endblock content %}
      {% if GOOGLE_LOGIN and request.resolver_match.url_name == "account_login" %}
        <div class="mt-6 border-t border-stone-200 pt-6 dark:border-stone-800">
          <form method="post" action="{% url 'google_login' %}">{% csrf_token %}<button type="submit" class="btn-secondary w-full">Continuer avec Google</button></form>
        </div>
      {% endif %}
    </section>
  </div>
{% endblock main %}
