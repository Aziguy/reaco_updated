name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: comegusto
          POSTGRES_USER: comegusto
          POSTGRES_PASSWORD: comegusto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comegusto" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://comegusto:comegusto@localhost:5432/comegusto
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - run: uv run pytest --cov --cov-report=term-missing

  deploy-check:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-but-long-enough
      ALLOWED_HOSTS: comegusto.example.org
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python manage.py check --deploy --fail-level WARNING

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: comegusto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
